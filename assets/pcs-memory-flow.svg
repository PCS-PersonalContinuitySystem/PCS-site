<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
 <title id="title">How PCS memory works</title>
 <desc id="description">With permission, saved conversation passages support revisable memory interpretations. The owner can inspect, correct or forget them. Recall searches current evidence for the present question, carries necessary corrections, and rechecks permissions and freshness before use. Incomplete correction bundles and uncertain neighboring context are withheld; missing turns are never reconstructed.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a9c79b"/></marker></defs>
 <style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#e8eef0}.title{font-size:38px;font-weight:650}.section{font-size:16px;letter-spacing:2px;fill:#b6cca2}.heading{font-size:23px;font-weight:600}.body{font-size:19px;fill:#c4d2d6}.small{font-size:17px;fill:#c4d2d6}.card{fill:#192e38;stroke:#547078;stroke-width:1.5}.line{fill:none;stroke:#a9c79b;stroke-width:2;marker-end:url(#arrow)}</style>
 <rect width="1200" height="900" rx="18" fill="#0d1b23"/>
 <text x="48" y="66" class="title">How PCS memory works</text>
 <text x="48" y="103" class="body">Original sources, revisable interpretations, and evidence for the present conversation.</text>
 <text x="48" y="162" class="section">01 · FORM MEMORIES WITH YOUR PERMISSION</text>
 <rect x="48" y="185" width="330" height="165" rx="14" class="card"/>
 <text x="70" y="225" class="heading">Saved conversation</text>
 <text x="70" y="261" class="body"><tspan x="70">Original passages keep the</tspan><tspan x="70" dy="28">recorded words and speakers.</tspan><tspan x="70" dy="28">Transcripts can be mistaken.</tspan></text>
 <path d="M378 265H430" class="line"/>
 <rect x="432" y="185" width="330" height="165" rx="14" class="card"/>
 <text x="454" y="225" class="heading">Memory formation</text>
 <text x="454" y="261" class="body"><tspan x="454">Your chosen Memory provider</tspan><tspan x="454" dy="28">forms interpretations linked</tspan><tspan x="454" dy="28">to the saved sources.</tspan></text>
 <path d="M762 265H814" class="line"/>
 <rect x="816" y="185" width="336" height="165" rx="14" class="card"/>
 <text x="838" y="225" class="heading">Your saved memories</text>
 <text x="838" y="261" class="body"><tspan x="838">Working notes in your vault.</tspan><tspan x="838" dy="28">Inspect sources and history;</tspan><tspan x="838" dy="28">correct or forget when needed.</tspan></text>
 <path d="M984 350V383H600V416" class="line"/>
 <rect x="48" y="416" width="1104" height="97" rx="14" fill="#21372f" stroke="#69835e"/>
 <text x="72" y="451" class="heading">You stay in control</text>
 <text x="72" y="483" class="body">Your edits stay authoritative. Relevant recall carries current corrections, checked again before use.</text>
 <text x="48" y="563" class="section">02 · RECALL FOR THE QUESTION IN FRONT OF YOU</text>
 <rect x="48" y="586" width="238" height="172" rx="14" class="card"/>
 <text x="68" y="624" class="heading">Present question</text>
 <text x="68" y="660" class="body"><tspan x="68">The current exchange</tspan><tspan x="68" dy="28">sets the purpose.</tspan><tspan x="68" dy="28">Recall is optional.</tspan></text>
 <path d="M286 669H335" class="line"/>
 <rect x="337" y="586" width="238" height="172" rx="14" class="card"/>
 <text x="357" y="624" class="heading">Search candidates</text>
 <text x="357" y="660" class="body"><tspan x="357">Current memories and</tspan><tspan x="357" dy="28">permitted passages.</tspan><tspan x="357" dy="28">Words or meaning.</tspan></text>
 <path d="M575 669H624" class="line"/>
 <rect x="626" y="586" width="238" height="172" rx="14" class="card"/>
 <text x="646" y="624" class="heading">Check evidence</text>
 <text x="646" y="660" class="body"><tspan x="646">Current permissions.</tspan><tspan x="646" dy="28">Complete corrections.</tspan><tspan x="646" dy="28">Retained context only.</tspan></text>
 <path d="M864 669H913" class="line"/>
 <rect x="915" y="586" width="237" height="172" rx="14" class="card"/>
 <text x="935" y="624" class="heading">Permitted reply</text>
 <text x="935" y="660" class="body"><tspan x="935">Only selected evidence</tspan><tspan x="935" dy="28">goes to the chosen</tspan><tspan x="935" dy="28">Conversation provider.</tspan></text>
 <text x="48" y="809" class="small">If PCS can’t include your correction, it skips that part of the recall. It does not delete your saved memory.</text>
 <text x="48" y="839" class="small">Browsing Library, Inspect, word search or Map stays on your PC. AI features follow your sharing settings.</text>
 <text x="48" y="869" class="small">A saved memory can still be mistaken. Check the original conversation and correct it when needed.</text>
</svg>
