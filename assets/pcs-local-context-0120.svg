<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title description">
<title id="title">How Local chooses context in PCS 0.9.120</title><desc id="description">A current typed or completed spoken question can use recent conversation, compacted working context, a permission-controlled saved-memory lookup, an available relevant image, both evidence routes, or neither. Optional saved area and lesson names help the Local lookup decision. Context compaction leaves saved originals unchanged.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9eba8b"/></marker></defs>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#e9eee6}.title{font-family:Georgia,serif;font-size:40px}.label{font-size:16px;letter-spacing:2px;fill:#bbd1a6}.heading{font-size:24px;font-weight:600}.body{font-size:20px;fill:#d2dcd1}.small{font-size:18px;fill:#c5d3c1}.card{fill:#1e3930;stroke:#617b66;stroke-width:1.5}.line{fill:none;stroke:#9eba8b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="1010" rx="18" fill="#122a23"/>
<text x="48" y="68" class="title">Bring the context this question needs</text>
<text x="48" y="110" class="body">Local reply preparation in PCS 0.9.120</text>
<rect x="48" y="151" width="440" height="165" rx="14" class="card"/>
<text x="72" y="194" class="heading">Your question in context</text>
<text x="72" y="234" class="body">Typed input or completed speech.</text>
<text x="72" y="263" class="body">Recent complete exchanges and</text>
<text x="72" y="292" class="body">compacted working context.</text>
<rect x="544" y="151" width="608" height="165" rx="14" class="card"/>
<text x="568" y="194" class="heading">A short context decision</text>
<text x="568" y="234" class="body">Would memory or an available image help?</text>
<text x="568" y="263" class="body">Optional area and lesson names guide lookup.</text>
<text x="568" y="292" class="body">The decision itself receives no screen pixels.</text>
<path d="M488 233H542" class="line"/>
<path d="M848 316V346H218V376" class="line"/>
<path d="M848 346H600V376" class="line"/>
<path d="M848 346H982V376" class="line"/>
<rect x="48" y="378" width="340" height="220" rx="14" class="card"/>
<text x="72" y="421" class="heading">Saved context</text>
<text x="72" y="461" class="body">“How did my plan change?”</text>
<text x="72" y="490" class="body">Retrieve permitted evidence,</text>
<text x="72" y="519" class="body">linked history or lesson stories.</text>
<text x="72" y="548" class="body">Keep required corrections.</text>
<rect x="430" y="378" width="340" height="220" rx="14" class="card"/>
<text x="454" y="421" class="heading">Visual context</text>
<text x="454" y="461" class="body">“What is shown here?”</text>
<text x="454" y="490" class="body">Use an available current frame</text>
<text x="454" y="519" class="body">when relevant and permitted.</text>
<text x="454" y="548" class="body">Vision has its own controls.</text>
<rect x="812" y="378" width="340" height="220" rx="14" class="card"/>
<text x="836" y="421" class="heading">Neither is needed</text>
<text x="836" y="461" class="body">“What is seven times eight?”</text>
<text x="836" y="490" class="body">Reply without a personal</text>
<text x="836" y="519" class="body">lookup or incidental</text>
<text x="836" y="548" class="body">desktop imagery.</text>
<path d="M218 598V628H600V657" class="line"/>
<path d="M600 598V657" class="line"/>
<path d="M982 598V628H600" fill="none" stroke="#9eba8b" stroke-width="2"/>
<rect x="48" y="659" width="1104" height="131" rx="14" class="card"/>
<text x="72" y="702" class="heading">Compose the reply with selected context</text>
<text x="72" y="742" class="body">A question can need both memory and an image. Existing sharing and freshness checks apply.</text>
<text x="72" y="771" class="body">Retrieval can miss a relevant record, and the model can still interpret the evidence incorrectly.</text>
<text x="48" y="839" class="small">Long sessions compact working context; older exact wording stays searchable during that session.</text>
<text x="48" y="872" class="small">Saved originals are unchanged. Context capacity depends on your model, hardware and enabled features.</text>
<text x="48" y="905" class="small">Recommended CUDA: 128K default, selectable up to 256K. Other routes have their own limits.</text>
<text x="48" y="938" class="small">Simplified workflow · Optional hints are not required for recall. No cloud AI fallback for Local memory.</text>
</svg>
