<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="title description">
<title id="title">PCS memory: how memories are made, kept and reach a conversation</title><desc id="description">A simplified PCS 0.9.180 workflow, authored as a guide rather than captured from the interface. Save and check: original conversation passages are saved; a memory writer drafts accounts from them; a separate review checks each draft against the passages before anything is saved; accepted drafts become saved, revisable memories linked to their sources. A rejected draft is not saved and its passages wait for a later job. You can correct a saved memory in your own words. Give the history your own structure: link memories, mark a revision settled and keep named lessons. How memory reaches a conversation, in three lanes. At Start: the Start summary written by memory jobs, or, if you turn it on, an experimental fuller picture rebuilt from your current records. As you talk: if you turn it on, experimental memories that come to mind on their own, up to three related memories or earlier turns per turn, and nothing when nothing is clearly related. When more is needed: a permitted lookup returns selected evidence after sharing, version and correction checks. Your conversation model receives the selected material; an optional display shows what it was given. Matching uses words, not meaning; the model can overlook or contradict a memory; a failed lookup does not mean nothing was saved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#9eba8b"/></marker></defs>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#e9eee6}.title{font-family:Georgia,serif;font-size:40px}.label{font-size:16px;letter-spacing:2px;fill:#bbd1a6}.lane{font-size:22px;font-weight:600;fill:#bbd1a6}.heading{font-size:24px;font-weight:600}.body{font-size:20px;fill:#d2dcd1}.small{font-size:18px;fill:#c5d3c1}.tag{font-size:13px;letter-spacing:1.5px;font-weight:600;fill:#122a23}.card{fill:#1e3930;stroke:#617b66;stroke-width:1.5}.optional{fill:#1a332b;stroke:#bbd1a6;stroke-width:2;stroke-dasharray:8 6}.tagbox{fill:#bbd1a6}.line{fill:none;stroke:#9eba8b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="1580" rx="18" fill="#122a23"/>
<text x="48" y="68" class="title">Keep the evidence. Keep how you changed.</text>
<text x="48" y="110" class="body">Your saved continuity stays in PCS while you choose the model that helps you think.</text>

<text x="48" y="165" class="label">01 / SAVE AND CHECK</text>
<rect x="48" y="188" width="246" height="186" rx="14" class="card"/>
<text x="68" y="229" class="heading">Original passages</text>
<text x="68" y="268" class="body">Recorded words</text>
<text x="68" y="296" class="body">and speakers.</text>
<text x="68" y="324" class="body">Saving and learning</text>
<text x="68" y="352" class="body">are separate choices.</text>
<rect x="334" y="188" width="246" height="186" rx="14" class="card"/>
<text x="354" y="229" class="heading">Memory writer</text>
<text x="354" y="268" class="body">Drafts accounts</text>
<text x="354" y="296" class="body">from passages that</text>
<text x="354" y="324" class="body">are waiting to be</text>
<text x="354" y="352" class="body">learned.</text>
<rect x="620" y="188" width="246" height="186" rx="14" class="card"/>
<text x="640" y="229" class="heading">Separate review</text>
<text x="640" y="268" class="body">Checks each draft</text>
<text x="640" y="296" class="body">against the passages</text>
<text x="640" y="324" class="body">before anything</text>
<text x="640" y="352" class="body">is saved.</text>
<rect x="906" y="188" width="246" height="186" rx="14" class="card"/>
<text x="926" y="229" class="heading">Saved memory</text>
<text x="926" y="268" class="body">Revisable, linked</text>
<text x="926" y="296" class="body">to its sources.</text>
<text x="926" y="324" class="body">Inspect the wording</text>
<text x="926" y="352" class="body">and history.</text>
<path d="M294 281H332" class="line"/>
<path d="M580 281H618" class="line"/>
<path d="M866 281H904" class="line"/>
<text x="48" y="414" class="small">A rejected draft is not saved; its passages wait for a later job.</text>
<path d="M1029 444V378" class="line"/>
<rect x="48" y="446" width="1104" height="108" rx="14" class="card"/>
<text x="72" y="488" class="heading">Your corrections</text>
<text x="72" y="527" class="body">Revise a saved memory in your own words. Corrections stay distinct and travel with recalled evidence.</text>

<text x="48" y="610" class="label">02 / GIVE THE HISTORY YOUR OWN STRUCTURE</text>
<rect x="48" y="633" width="340" height="140" rx="14" class="card"/>
<text x="72" y="675" class="heading">Links between memories</text>
<text x="72" y="714" class="body">“Changed into” or “because of.”</text>
<text x="72" y="743" class="body">Follow how a decision grew.</text>
<rect x="430" y="633" width="340" height="140" rx="14" class="card"/>
<text x="454" y="675" class="heading">Settled marks</text>
<text x="454" y="714" class="body">Your current word on a subject.</text>
<text x="454" y="743" class="body">A correction retires the mark.</text>
<rect x="812" y="633" width="340" height="140" rx="14" class="card"/>
<text x="836" y="675" class="heading">Named lessons</text>
<text x="836" y="714" class="body">A name, story and takeaway,</text>
<text x="836" y="743" class="body">with supporting memories.</text>

<text x="48" y="832" class="label">03 / HOW MEMORY REACHES A CONVERSATION</text>
<text x="48" y="878" class="lane">At Start</text>
<text x="430" y="878" class="lane">As you talk</text>
<text x="812" y="878" class="lane">When more is needed</text>
<rect x="48" y="898" width="340" height="150" rx="14" class="card"/>
<text x="72" y="940" class="heading">Start summary</text>
<text x="72" y="979" class="body">Written by memory jobs</text>
<text x="72" y="1008" class="body">and checked by the review.</text>
<rect x="48" y="1068" width="340" height="196" rx="14" class="optional"/>
<rect x="72" y="1088" width="232" height="26" class="tagbox"/>
<text x="82" y="1106" class="tag">OPTIONAL · EXPERIMENTAL</text>
<text x="72" y="1150" class="heading">Or a fuller picture</text>
<text x="72" y="1189" class="body">Your name, up to five</text>
<text x="72" y="1218" class="body">subjects and your last talk,</text>
<text x="72" y="1247" class="body">rebuilt from current records.</text>
<rect x="430" y="898" width="340" height="366" rx="14" class="optional"/>
<rect x="454" y="918" width="232" height="26" class="tagbox"/>
<text x="464" y="936" class="tag">OPTIONAL · EXPERIMENTAL</text>
<text x="454" y="980" class="heading">Memories come to mind</text>
<text x="454" y="1019" class="body">PCS searches on your PC</text>
<text x="454" y="1048" class="body">for memories and earlier</text>
<text x="454" y="1077" class="body">turns related to what you</text>
<text x="454" y="1106" class="body">just said: up to three.</text>
<text x="454" y="1150" class="body">Nothing when nothing</text>
<text x="454" y="1179" class="body">is clearly related.</text>
<text x="454" y="1223" class="small">Word matching, not meaning.</text>
<rect x="812" y="898" width="340" height="150" rx="14" class="card"/>
<text x="836" y="940" class="heading">Permitted lookup</text>
<text x="836" y="979" class="body">When nothing arrived,</text>
<text x="836" y="1008" class="body">or the model needs more.</text>
<path d="M982 1048V1066" class="line"/>
<rect x="812" y="1068" width="340" height="196" rx="14" class="card"/>
<text x="836" y="1110" class="heading">Selected evidence</text>
<text x="836" y="1149" class="body">Sharing, version and</text>
<text x="836" y="1178" class="body">correction checks run</text>
<text x="836" y="1207" class="body">before anything is sent.</text>
<path d="M218 1264V1302" class="line"/>
<path d="M600 1264V1302" class="line"/>
<path d="M982 1264V1302" class="line"/>
<rect x="48" y="1304" width="1104" height="126" rx="14" class="card"/>
<text x="72" y="1346" class="heading">Your conversation model</text>
<text x="72" y="1385" class="body">Receives the selected material, within your sharing choices. You can inspect its answer.</text>
<text x="72" y="1414" class="small">Optional and experimental: “Show what PCS has in mind” lists what the model was given.</text>

<text x="48" y="1474" class="small">Matching uses words, not meaning. The model can overlook or contradict a memory it was given.</text>
<text x="48" y="1505" class="small">A failed lookup does not mean nothing was saved. Memories and model answers can still be wrong.</text>
<text x="48" y="1536" class="small">Cloud requests disclose permitted content. Original Materials files and exports are outside vault encryption.</text>
<text x="48" y="1567" class="small">PCS 0.9.180 authored workflow · Not a screenshot or a guarantee of recall.</text>
</svg>
